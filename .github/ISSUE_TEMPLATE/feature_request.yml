name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - routing
        - popup
        - install
        - other
    validations: {required: true}
  - type: textarea
    id: problem
    attributes: {label: What problem would this solve?}
    validations: {required: true}
  - type: textarea
    id: idea
    attributes: {label: What would you like to happen?}
