<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Bifurc — proxy unavailable</title>
    <link rel="stylesheet" href="theme.css">
    <style>
        html,
        body {
            min-height: 100%;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-xl) var(--space-lg);
        }

        main {
            width: 100%;
            max-width: 480px;
        }

        h1 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: var(--space-sm);
        }

        .lead {
            color: var(--muted-foreground);
        }

        dl {
            margin: var(--space-xl) 0;
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
        }

        dl div {
            display: flex;
            align-items: baseline;
            gap: var(--space-md);
            padding: var(--space-sm) var(--space-md);
        }

        dl div+div {
            border-top: 1px solid var(--border);
        }

        dt {
            flex: none;
            width: 88px;
            color: var(--muted-foreground);
            font-size: 12px;
        }

        dd {
            flex: 1;
            min-width: 0;
            word-break: break-all;
        }

        .conn {
            display: inline-flex;
            align-items: center;
            gap: var(--space-sm);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-sm);
        }

        .status {
            margin-top: var(--space-md);
            min-height: 18px;
        }
    </style>
</head>

<body>
    <main>
        <h1>Can't reach the Bifurc proxy</h1>
        <p class="lead" id="lead">
            The Proxy switch is on, but nothing answered at the forward proxy's port.
        </p>

        <dl>
            <div>
                <dt>Requested</dt>
                <dd class="mono" id="failedUrl">—</dd>
            </div>
            <div>
                <dt>Forward proxy</dt>
                <dd class="mono" id="proxyAddr">—</dd>
            </div>
            <div>
                <dt>Bifurc</dt>
                <dd><span class="conn"><span class="dot" id="connDot"></span><span id="connText">Checking…</span></span>
                </dd>
            </div>
        </dl>

        <div class="actions">
            <button class="btn primary" id="retryBtn">Try again</button>
            <button class="btn" id="disableBtn">Turn off proxy</button>
        </div>

        <p class="muted status" id="status" role="status"></p>
    </main>

    <script src="proxy-error.js"></script>
</body>

</html>
